name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Create signing certificate
        id: cert
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -Subject "CN=4EB8B421-4EE9-470A-8A8D-54E0C4F44E0C" `
            -KeyUsage DigitalSignature `
            -FriendlyName "DeDupe CI" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          Export-Certificate -Cert $cert -FilePath "$PWD\ci-signing.cer" | Out-Null
          Add-Content -Path $env:GITHUB_OUTPUT -Value "thumbprint=$($cert.Thumbprint)"

      - name: Build
        run: >
          dotnet build src/DeDupe/DeDupe.csproj
          -c Release
          -p:Platform=x64
          -p:GenerateAppxPackageOnBuild=true
          -p:AppxPackageSigningEnabled=true
          -p:PackageCertificateThumbprint=${{ steps.cert.outputs.thumbprint }}

      - name: Stage artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $exe = Get-ChildItem -Path src/DeDupe/bin -Recurse -Filter DeDupe.exe |
            Where-Object { $_.FullName -match '\\Release\\' -and $_.FullName -notmatch '\\ref\\' } |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $exe) { throw 'DeDupe.exe was not produced.' }

          $appStage = 'artifacts/DeDupe-x64'
          New-Item -ItemType Directory -Force -Path $appStage | Out-Null
          Copy-Item -Path (Join-Path $exe.DirectoryName '*') -Destination $appStage -Recurse -Force

          $packageStage = 'artifacts/DeDupe-x64-package'
          New-Item -ItemType Directory -Force -Path $packageStage | Out-Null
          $packages = Get-ChildItem -Path src/DeDupe/bin, src/DeDupe/AppPackages -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in '.msix', '.cer' -and $_.FullName -notmatch '\\obj\\' }
          if (-not $packages) { throw 'MSIX package was not produced.' }
          foreach ($package in $packages) {
            Copy-Item -Path $package.FullName -Destination (Join-Path $packageStage $package.Name) -Force
          }
          Copy-Item -Path ci-signing.cer -Destination (Join-Path $packageStage 'ci-signing.cer') -Force

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: DeDupe-x64
          if-no-files-found: error
          path: artifacts/DeDupe-x64

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: DeDupe-x64-msix
          if-no-files-found: error
          path: artifacts/DeDupe-x64-package
